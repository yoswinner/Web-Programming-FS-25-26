<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gen-Z Slang Detector</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding: 20px; background-color: #f0f2f5; }
        .container { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 450px; }
        textarea { width: 100%; height: 80px; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; margin-bottom: 15px; resize: none; }
        button { width: 100%; padding: 12px; background-color: #6c5ce7; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #a29bfe; }
        #output { margin-top: 20px; padding: 15px; border-radius: 6px; display: none; line-height: 1.5; white-space: pre-line; }
        .found { background-color: #e1f5fe; color: #01579b; border-left: 5px solid #01579b; display: block !important; }
        .not-found { background-color: #ffebee; color: #c62828; border-left: 5px solid #c62828; display: block !important; }
    </style>
</head>
<body>

<div class="container">
    <h2>Slang Translator</h2>
    <textarea id="userMessage" placeholder="Type your message here (e.g., idk what to do)"></textarea>
    <button onclick="checkSlang()">Translate Message</button>
    <div id="output"></div>
</div>

<script>
    function checkSlang() {
        const message = document.getElementById('userMessage').value;
        const outputDiv = document.getElementById('output');

        const slangDictionary = {
            "idk": "I don't know",
            "fr": "For real",
            "no cap": "No lie / Truthfully",
            "bet": "Agreement / Okay",
            "slay": "Doing something very well",
            "lowkey": "Secretly / Slightly",
            "highkey": "Openly / Very much",
            "sus": "Suspicious",
            "ghosted": "Ignored someone completely",
            "rizz": "Charisma / Romantic appeal",
            "rn": "Right now"
        };

        const slangRegex = /\b(idk|fr|no cap|bet|slay|lowkey|highkey|sus|ghosted|rizz|rn)\b/gi;

        const matches = Array.from(message.matchAll(slangRegex));

        outputDiv.className = '';
        
        if (matches.length > 0) {
            let resultText = "Found Slang:\n";
            const uniqueMatches = [...new Set(matches.map(m => m[0].toLowerCase()))];
            
            uniqueMatches.forEach(word => {
                resultText += `• ${word.toUpperCase()}: ${slangDictionary[word]}\n`;
            });

            outputDiv.textContent = resultText;
            outputDiv.classList.add('found');
        } else {
            outputDiv.textContent = "It’s not a Gen Z word.";
            outputDiv.classList.add('not-found');
        }
    }
</script>

</body>
</html>
