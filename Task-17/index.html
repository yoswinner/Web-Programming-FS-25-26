 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Image Slider</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
        }

        .slider-container {
            text-align: center;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 90%;
        }

        .image-wrapper {
            width: 100%;
            height: 350px;
            overflow: hidden;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        #slider-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.3s ease;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn {
            background-color: #333;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.2s;
        }

        .btn:hover { background-color: #555; }
        
        #image-index {
            font-weight: bold;
            color: #777;
        }
    </style>
</head>
<body>

    <div class="slider-container">
        <h2>Travel Destinations</h2>
        
        <div class="image-wrapper">
            <img id="slider-img" src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=600" alt="Slider Image">
        </div>

        <div class="controls">
            <button class="btn" onclick="prevSlide()">Previous</button>
            <span id="image-index">Image 1 of 4</span>
            <button class="btn" onclick="nextSlide()">Next</button>
        </div>
    </div>

    <script>
        const images = [
            "https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=600",
            "https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=600",
            "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=600",
            "https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=600"
        ];

        let currentIndex = 0;
        const imgElement = document.getElementById('slider-img');
        const indexText = document.getElementById('image-index');

        function updateSlider() {
            imgElement.src = images[currentIndex];
            indexText.textContent = `Image ${currentIndex + 1} of ${images.length}`;
        }
        function nextSlide() {
            currentIndex++;
            if (currentIndex >= images.length) {
                currentIndex = 0;
            }
            updateSlider();
        }

        function prevSlide() {
            currentIndex--;
            if (currentIndex < 0) {
                currentIndex = images.length - 1;
            }
            updateSlider();
        }
    </script>
</body>
</html>
